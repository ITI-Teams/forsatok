<button (click)="toggleTheme()" class="p-2 rounded border border-gray-200 dark:border-gray-700">
  @if (!isDark) {
  <!-- ☀️ Light Mode Icon -->
  <svg class="w-5 h-5 text-gray-700" viewBox="0 0 24 24" fill="none">
    <path
      d="M12 3v1.5M12 19.5V21M4.22 4.22l1.06 1.06M18.72 18.72l1.06 1.06M3 12h1.5M19.5 12H21M4.22 19.78l1.06-1.06M18.72 5.28l1.06-1.06M12 6a6 6 0 0 1 0 12 6 6 0 0 1 0-12Z"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  } @else {
  <!-- 🌙 Dark Mode Icon -->
  <svg class="w-5 h-5 text-gray-200" viewBox="0 0 24 24" fill="none">
    <path d="M21.752 15.002A9.72 9.72 0 0 1 12 21.75 9.75 9.75 0 0 1 9.51 2.31a9.75 9.75 0 0 0 12.24 12.69Z"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  }
</button>
