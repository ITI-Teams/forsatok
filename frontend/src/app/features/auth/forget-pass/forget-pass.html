<div class="h-screen w-screen overflow-hidden bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">
  <div class="w-full max-w-7xl max-h-[90vh] flex bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden">
    
    <!-- Left Side - Image with Overlay -->
    <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden">
      <!-- Gradient Overlay -->
      <div class="absolute inset-0 bg-gradient-to-br from-slate-900/90 via-purple-900/80 to-pink-900/90 z-10"></div>
      
      <!-- Background Image -->
      <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&h=1200&fit=crop" 
           alt="Abstract" 
           class="absolute inset-0 w-full h-full object-cover">
      
      <!-- Content Overlay -->
      <div class="relative z-20 p-12 flex flex-col justify-between">
        <!-- Main Content -->
        <div class="space-y-6">
          <h2 class="text-5xl font-bold text-white leading-tight">
            Reset your<br>password
          </h2>
          <p class="text-purple-200 text-lg leading-relaxed max-w-md">
            Don't worry! We'll help you recover your account quickly and securely.
          </p>
        </div> 
      </div>
    </div>

    <!-- Right Side - Forgot Password Form -->
    <div class="w-full lg:w-1/2 flex flex-col overflow-hidden">
      <div class="flex-1 flex items-center justify-center p-6 lg:p-8">
        <div class="w-full max-w-md space-y-4">
          <!-- Header -->
          <div class="mb-10">
                <h1 class="text-4xl lg:text-5xl font-bold leading-normal lg:leading-relaxed bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-6">
                    Forgot Password
                </h1>

                <p class="text-gray-600 text-base">
                    We'll send a verification code to your email address
                </p>
            </div>


          <form (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Email Field -->
            <div class="group">
              <label class="block text-md font-semibold text-gray-700 mb-2">Email Address</label>
              <input 
                type="email" 
                [(ngModel)]="email"
                name="email"
                placeholder="john52martinez@gmail.com"
                class="w-full px-4 py-3.5 text-md bg-gray-50 border-2 border-gray-200 rounded-3xl placeholder-gray-400 placeholder:text-sm focus:bg-white focus:border-purple-500 focus:ring-2 focus:ring-purple-500/10 outline-none transition-all duration-300">
            </div>

            <!-- Submit Button -->
            <button 
              type="submit"
              routerLink="/ver-code"
              class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white py-3 rounded-3xl font-semibold shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition-all duration-300 text-md cursor-pointer">
              Send Verification Code
            </button>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
