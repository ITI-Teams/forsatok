<div
  class="h-screen w-screen overflow-hidden bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">
  <p-toast></p-toast>
  <div class="w-full max-w-5xl max-h-[80vh] flex bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden">

    <!-- Left Side - Image with Overlay -->
    <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden">
      <!-- Gradient Overlay -->
      <div class="absolute inset-0 bg-gradient-to-br from-slate-900/90 via-purple-900/80 to-pink-900/90 z-10"></div>

      <!-- Background Image -->
      <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&h=1200&fit=crop" alt="Abstract"
        class="absolute inset-0 w-full h-full object-cover">

      <!-- Content Overlay -->
      <div class="relative z-20 p-12 flex flex-col justify-between">


        <!-- Main Content -->
        <div class="space-y-6">
          <h2 class="text-4xl font-bold text-white leading-tight">
            Start your<br>journey with us
          </h2>
          <p class="text-purple-200 text-base leading-relaxed max-w-md">
            Join thousands of users who are already experiencing the future of digital innovation.
          </p>
          <div class="space-y-4 pt-4">
          </div>
        </div>
      </div>
    </div>

    <!-- Right Side - Form -->
    <div class="w-full lg:w-1/2 flex flex-col overflow-hidden">
      <div class="flex-1 flex items-center justify-center p-6 lg:p-8">
        <div class="w-full max-w-md space-y-4">
          <!-- Header -->
          <div class="mb-4">
            <h1
              class="text-3xl lg:text-3xl font-bold leading-normal lg:leading-relaxed bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">
              Create Account
            </h1>
            <p class="text-gray-600 text-sm">
              Already have an account?
              <a routerLink="/login"
                class="text-purple-600 hover:underline text-purple-700 font-semibold ml-1 transition">
                Log in
              </a>
            </p>
          </div>

          <form (ngSubmit)="onSubmit()" class="space-y-3">
            <!-- Name Fields -->
            <div class="group">
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Name</label>
              <input type="text" [(ngModel)]="name" name="firstName" placeholder="First Name"
                class="w-full px-3 py-2 text-sm bg-gray-50 border-2 border-gray-200 rounded-3xl placeholder-gray-400 placeholder:text-sm focus:bg-white focus:border-purple-500 focus:ring-2 focus:ring-purple-500/10 outline-none transition-all duration-300">
            </div>

            <!-- Email Field -->
            <div class="group">
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email Address</label>
              <input type="email" [(ngModel)]="email" name="email" placeholder="your@email.com"
                class="w-full px-3 py-2 text-sm bg-gray-50 border-2 border-gray-200 rounded-3xl placeholder-gray-400 placeholder:text-sm focus:bg-white focus:border-purple-500 focus:ring-2 focus:ring-purple-500/10 outline-none transition-all duration-300">
            </div>

            <!-- Password Field -->
            <div class="group">
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
              <div class="relative">
                <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password"
                  placeholder="••••••••"
                  class="w-full px-3 py-2 text-sm bg-gray-50 border-2 border-gray-200 rounded-3xl placeholder-gray-400 placeholder:text-sm focus:bg-white focus:border-purple-500 focus:ring-2 focus:ring-purple-500/10 outline-none transition-all duration-300 pr-10">
                <button type="button" (click)="togglePasswordVisibility()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-purple-600 transition">
                  <svg *ngIf="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                  <svg *ngIf="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                  </svg>
                </button>
              </div>
            </div>

            <!-- Terms Checkbox -->
            <div class="flex items-start">
              <input type="checkbox" [(ngModel)]="agreeToTerms" name="agreeToTerms" id="terms"
                class="w-4 h-4 mt-0.5 rounded-lg border-2 border-gray-300 text-purple-600 focus:ring-2 focus:ring-purple-500 cursor-pointer">
              <label for="terms" class="ml-2 text-xs text-gray-700 leading-relaxed cursor-pointer">
                I agree to the <a href="#" class="text-purple-600 font-semibold hover:text-purple-700">Terms &
                  Condition</a>
              </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" [disabled]="loading"
              class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white py-2.5 rounded-3xl font-semibold shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition-all duration-300 text-md cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed">
              <span *ngIf="!loading">Create Account</span>
              <span *ngIf="loading">Creating...</span>
            </button>

            <!-- Divider -->
            <div class="flex items-center my-3">
              <div class="flex-1 border-t border-gray-300"></div>
              <span class="px-3 text-gray-400 text-xs font-medium">OR CONTINUE WITH</span>
              <div class="flex-1 border-t border-gray-300"></div>
            </div>

            <!-- Social Login Buttons -->
            <div class="grid grid-cols-2 gap-3">

              <button type="button" (click)="continueWithLinkedIn()"
                class="flex items-center justify-center px-3 py-2 bg-white border-2 border-gray-200 rounded-3xl hover:border-purple-300 hover:bg-purple-50 transition-all duration-300 group cursor-pointer">
                <svg class="w-4 h-4 mr-1.5" fill="#0A66C2" viewBox="0 0 24 24">
                  <path
                    d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                </svg>
                <span class="text-sm font-semibold text-gray-700 group-hover:text-purple-700">LinkedIn</span>
              </button>

              <button type="button" (click)="continueWithGoogle()"
                class="flex items-center justify-center px-3 py-2 bg-white border-2 border-gray-200 rounded-3xl hover:border-red-300 hover:bg-red-50 transition-all duration-300 group cursor-pointer">
                <svg class="w-4 h-4 mr-1.5" viewBox="0 0 24 24">
                  <path fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                  <path fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                  <path fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" />
                  <path fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" />
                </svg>
                <span class="text-sm font-semibold text-gray-700 group-hover:text-red-700">Google</span>
              </button>

            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
