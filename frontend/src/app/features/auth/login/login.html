<div class="h-screen w-screen overflow-hidden bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">
  <p-toast></p-toast>
  <div class="w-full max-w-5xl max-h-[80vh] flex bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden">

    <!-- Left Side - Image with Overlay -->
    <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden">
      <!-- Gradient Overlay -->
      <div class="absolute inset-0 bg-gradient-to-br from-slate-900/90 via-purple-900/80 to-pink-900/90 z-10"></div>

      <!-- Background Image -->
      <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&h=1200&fit=crop"
           alt="Abstract"
           class="absolute inset-0 w-full h-full object-cover">

      <!-- Content Overlay -->
      <div class="relative z-20 p-12 flex flex-col justify-between">
        <!-- Main Content -->
        <div class="space-y-6">
          <h2 class="text-4xl font-bold text-white leading-tight">
            Welcome back!<br>Log in to continue
          </h2>
          <p class="text-purple-200 text-base leading-relaxed max-w-md">
            Access your account and continue your journey with us.
          </p>
        </div>
      </div>
    </div>

    <!-- Right Side - Login Form -->
    <div class="w-full lg:w-1/2 flex flex-col overflow-hidden">
      <div class="flex-1 flex items-center justify-center p-4 lg:p-8">
        <div class="w-full max-w-md space-y-4">
          <!-- Header -->
          <div class="mb-5">
            <h1 class="text-3xl lg:text-4xl font-bold leading-normal lg:leading-relaxed bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">
              Log in
            </h1>
            <p class="text-gray-600 text-sm">
              Don't have an account?
              <a routerLink="/register" class="text-purple-600 hover:underline font-semibold ml-1 transition">
                Create an Account
              </a>
            </p>
          </div>

          <form (ngSubmit)="onSubmit()" class="space-y-4">
            <!-- Email Field -->
            <div class="group">
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email Address</label>
              <input
                type="email"
                [(ngModel)]="form.email"
                name="email"
                placeholder="john52martinez@gmail.com"
                class="w-full px-4 py-3 text-sm bg-gray-50 border-2 border-gray-200 rounded-3xl placeholder-gray-400 placeholder:text-sm focus:bg-white focus:border-purple-500 focus:ring-2 focus:ring-purple-500/10 outline-none transition-all duration-300">
            </div>

            <!-- Password Field -->
            <div class="group">
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
              <div class="relative">
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  [(ngModel)]="form.password"
                  name="password"
                  placeholder="Password"
                  class="w-full px-4 py-3 text-sm bg-gray-50 border-2 border-gray-200 rounded-3xl placeholder-gray-400 placeholder:text-sm focus:bg-white focus:border-purple-500 focus:ring-2 focus:ring-purple-500/10 outline-none transition-all duration-300 pr-12">
                <button
                  type="button"
                  (click)="togglePasswordVisibility()"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-purple-600 transition">
                  <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                  <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Forgot Password -->
            <div class="text-right">
              <a routerLink="/forget-pass" class="text-xs font-semibold text-gray-700 hover:underline text-purple-600 transition">
                Forgot Password?
              </a>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              [disabled]="loading"
              class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white py-2.5 rounded-3xl font-semibold shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition-all duration-300 text-md cursor-pointer">
              <span *ngIf="!loading">Login</span>
              <span *ngIf="loading" class="animate-pulse">Logging in...</span>
            </button>

            <!-- Terms Checkbox -->
            <div class="flex items-start">
              <input
                type="checkbox"
                [(ngModel)]="agreeToTerms"
                name="agreeToTerms"
                id="terms"
                class="w-4 h-4 mt-0.5 rounded-lg border-2 border-gray-300 text-purple-600 focus:ring-2 focus:ring-purple-500 cursor-pointer">
              <label for="terms" class="ml-2 text-xs text-gray-700 leading-relaxed cursor-pointer">
                I agree to the <a href="#" class="text-purple-600 font-semibold hover:text-purple-700">Terms & Condition</a>
              </label>
            </div>

            <!-- Divider -->
            <div class="flex items-center my-4">
              <div class="flex-1 border-t border-gray-300"></div>
              <span class="px-3 text-gray-400 text-xs font-medium">OR CONTINUE WITH</span>
              <div class="flex-1 border-t border-gray-300"></div>
            </div>

            <!-- Social Login Buttons -->
            <div class="grid grid-cols-1 gap-3">

              <button
                type="button"
                (click)="continueWithLinkedIn()"
                class="flex items-center justify-center px-3 py-2 bg-white border-2 border-gray-200 rounded-3xl hover:border-purple-300 hover:bg-purple-50 transition-all duration-300 group cursor-pointer">
                <svg class="w-4 h-4 mr-1.5" fill="#0A66C2" viewBox="0 0 24 24">
                  <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
                <span class="text-md font-semibold text-gray-700 group-hover:text-purple-700">LinkedIn</span>
              </button>

            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
