<section>
  <div class="max-w-7xl mx-auto px-4 lg:px-8 py-12">
    <h2 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-2">Featured Cities</h2>
    <p class="text-gray-500 dark:text-gray-400 mb-10">Discover opportunities in top locations</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 auto-rows-auto">

      <!-- First City -->
      <ng-container *ngIf="cities && cities.length > 0; else noCities">
        <div
          [routerLink]="['/jobs']"
          [queryParams]="{ location: getCitySlug(cities[0]) }"
          class="relative overflow-hidden rounded-2xl shadow-sm bg-gray-100 dark:bg-gray-800 row-span-2 cursor-pointer">
          <div class="relative group w-full h-full">
            <img
              [src]="getCityImage(cities[0])"
              [alt]="getCityName(cities[0])"
              class="w-full h-full object-cover transform transition-transform duration-500 ease-out group-hover:scale-110 group-hover:rotate-2" />
            <div class="absolute inset-0 bg-black/20 dark:bg-black/30 group-hover:bg-black/40 dark:group-hover:bg-black/60 transition-colors duration-300 ease-in-out">
            </div>
            <div class="absolute bottom-4 left-4 z-10">
              <h4 class="text-2xl font-semibold text-white mb-1">{{ getCityName(cities[0]) }}</h4>
              <p class="text-gray-200 text-sm">{{ getJobsCount(cities[0]) }} Jobs</p>
            </div>
          </div>
        </div>

        <!-- Other Cities -->
        <div
          *ngFor="let city of getOtherCities()"
          [routerLink]="['/jobs']"
          [queryParams]="{ location: getCitySlug(city) }"
          class="relative overflow-hidden rounded-2xl shadow-sm bg-gray-100 dark:bg-gray-800 cursor-pointer">
          <div class="relative group w-full h-64">
            <img
              [src]="getCityImage(city)"
              [alt]="getCityName(city)"
              class="w-full h-full object-cover transform transition-transform duration-500 ease-out group-hover:scale-110 group-hover:rotate-2" />
            <div class="absolute inset-0 bg-black/20 dark:bg-black/30 group-hover:bg-black/40 dark:group-hover:bg-black/60 transition-colors duration-300 ease-in-out">
            </div>
            <div class="absolute bottom-4 left-4 z-10">
              <h4 class="text-xl font-semibold text-white mb-1">{{ getCityName(city) }}</h4>
              <p class="text-gray-200 text-sm">{{ getJobsCount(city) }} Jobs</p>
            </div>
          </div>
        </div>
      </ng-container>

      <ng-template #noCities>
        <!-- Show placeholder when no cities -->
        <div class="col-span-3 text-center py-12 text-gray-500">
          No cities available
        </div>
      </ng-template>
    </div>
  </div>
</section>
