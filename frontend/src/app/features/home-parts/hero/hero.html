<section
  class="relative w-full h-[1100px] pt-[80px] overflow-hidden flex items-center justify-center bg-gray-100 dark:bg-gray-900 transition-colors duration-500">
  <!-- Video Background -->
  <video #heroVideo autoplay loop playsinline preload="auto" class="absolute top-0 left-0 w-full h-full object-cover">
    <source src="/videos/office.mp4" type="video/mp4">
  </video>

  <!-- Overlay -->
  <div id="overlay"
    class="absolute top-0 left-0 w-full h-full bg-blue-900/60 dark:bg-gray-900/70 transition-colors duration-500"></div>

  <!-- Main Container -->
  <div class="relative min-h-screen flex items-center justify-between px-8 lg:px-20">

    <!-- Left Content Section -->
    <div class="w-full lg:w-1/2 z-10 py-20 flex flex-col">
      <h1 class="text-5xl lg:text-7xl font-bold text-gray-100 dark:text-white mb-6 leading-tight transition-colors">
        Find Your Perfect Job Match
      </h1>
      <p class="text-gray-100 dark:text-gray-300 text-xl lg:text-2xl mb-12 opacity-90 transition-colors">
        Find Jobs, Employment & Career Opportunities
      </p>

      <!-- Search Box -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 mb-2 transition-colors duration-500">
        <div class="flex flex-col md:flex-row gap-3">
          <div
            class="flex items-center flex-1 border-b md:border-b-0 md:border-r border-gray-200 dark:border-gray-700 pb-3 md:pb-0 md:pr-4">
            <i class="fas fa-search text-gray-400 dark:text-gray-500 mr-3"></i>
            <input type="text" placeholder="Job title, keywords, or company"
              class="w-full bg-transparent outline-none text-gray-700 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 transition-colors">
          </div>
          <div class="flex items-center flex-1 pb-3 md:pb-0">
            <i class="fas fa-map-marker-alt text-gray-400 dark:text-gray-500 mr-3"></i>
            <input type="text" placeholder="City or postcode"
              class="w-full bg-transparent outline-none text-gray-700 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 transition-colors">
          </div>
          <button
            class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white px-8 py-3 rounded-xl font-semibold transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
            Find Jobs
          </button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2 text-sm mb-8">
        <span class="text-gray-100 dark:text-gray-300">Popular Searches :</span>
        <span
          class="text-blue-400 hover:text-gray-900 dark:hover:text-gray-100 cursor-pointer">Designer,</span>
        <span
          class="text-blue-400 hover:text-gray-900 dark:hover:text-gray-100 cursor-pointer">Developer,</span>
        <span
          class="text-blue-400 hover:text-gray-900 dark:hover:text-gray-100 cursor-pointer">Web,</span>
        <span
          class="text-blue-400 hover:text-gray-900 dark:hover:text-gray-100 cursor-pointer">iOS,</span>
        <span
          class="text-blue-400 hover:text-gray-900 dark:hover:text-gray-100 cursor-pointer">PHP,</span>
        <span
          class="text-blue-400 hover:text-gray-900 dark:hover:text-gray-100 cursor-pointer">Senior,</span>
        <span
          class="text-blue-400 hover:text-gray-900 dark:hover:text-gray-100 cursor-pointer">Engineer,</span>
      </div>

      <div class="flex justify-between items-center flex-col xl:flex-row gap-8">
        <!-- Candidates -->
        <div class="flex items-center gap-3">
          <div class="flex -space-x-5">
            <ng-container *ngFor="let candidate of candidates">
              <div
                class="w-12 h-12 rounded-full border-2 border-gray-100 dark:border-gray-800 bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white font-bold text-sm">
                {{candidate.initials}}
              </div>
            </ng-container>
          </div>
          <span class="text-white font-semibold transition-colors">10k+ Candidates</span>
        </div>

        <!-- Upload CV -->
        <div
          class="flex items-center gap-3 bg-gray-200/60 dark:bg-white/10 backdrop-blur-sm p-4 rounded-xl border border-gray-300/40 dark:border-white/20 cursor-pointer hover:bg-gray-300/80 dark:hover:bg-white/20 transition-all">
          <i class="fas fa-upload text-gray-800 dark:text-white"></i>
          <span class="text-gray-900 dark:text-white font-semibold transition-colors">Upload your CV</span>
        </div>
      </div>
    </div>

    <!-- Right Image Section -->
    <div class="hidden lg:flex w-1/2 justify-end items-center relative">
      <div class="relative">
        <img src="/images/candidate.png" alt="Hero Image" class="w-80 h-80 rounded-full object-cover shadow-2xl">

        <!-- Floating Icons -->
        <ng-container *ngFor="let icon of companyIcons; let i = index">
          <div
            class="absolute w-16 h-16 bg-white dark:bg-gray-800 rounded-full shadow-xl flex items-center justify-center animate-bounce transition-colors"
            [ngStyle]="icon.position">
            <i [class]="icon.faClass + ' text-xl ' + icon.colorClass"></i>
          </div>
        </ng-container>
      </div>
    </div>

  </div>

  <!-- Background decorative elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div
      class="absolute w-96 h-96 bg-purple-400 dark:bg-purple-700 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -top-20 -left-20 animate-pulse">
    </div>
    <div
      class="absolute w-96 h-96 bg-blue-400 dark:bg-blue-700 rounded-full mix-blend-multiply filter blur-3xl opacity-20 top-40 right-20 animate-pulse"
      style="animation-delay: 1s;"></div>
    <div
      class="absolute w-96 h-96 bg-pink-400 dark:bg-pink-700 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -bottom-20 left-1/2 animate-pulse"
      style="animation-delay: 2s;"></div>
  </div>
</section>
