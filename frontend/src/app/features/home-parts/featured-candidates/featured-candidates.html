<section class="pt-12">
  <div class="max-w-7xl mx-auto px-4 lg:px-8">
    <h2 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-2">Featured Candidates</h2>
    <p class="text-gray-500 dark:text-gray-400 mb-10">
      Discover talented professionals ready for new opportunities
    </p>

    <swiper-container slides-per-view="1" space-between="20" loop="true" autoplay-delay="3000" pagination="true"
                      class="pb-16 custom-swiper" breakpoints='{"640": {"slidesPerView": 2}, "1024": {"slidesPerView": 4}}'>

      <swiper-slide *ngFor="let candidate of candidates">
        <div
          class="mb-16 mr-4 bg-gray-100 dark:bg-gray-800 rounded-2xl p-10 shadow-sm hover:shadow-lg transition-transform duration-300 ease-in-out flex flex-col items-center text-center">
          <img [src]="getCandidateImage(candidate)"
               [alt]="getCandidateName(candidate)"
               class="w-24 h-24 rounded-full mb-4 object-cover border border-gray-200 dark:border-gray-700" />

          <h4 class="text-xl font-semibold text-gray-800 dark:text-gray-100 mb-1">
            {{ getCandidateName(candidate) }}
          </h4>
          <p class="text-blue-600 dark:text-blue-400 font-medium mb-2">
            {{ getCandidateTitle(candidate) }}
          </p>
          <div class="flex items-center text-gray-600 dark:text-gray-400 text-sm mb-4">
            <i class="fa fa-map-marker-alt mr-1"></i>
            <span>{{ getCandidateLocation(candidate) }}</span>
          </div>
          <button routerLink="/candidate/{{ candidate.user_id }}"
                  class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-all duration-300 shadow hover:shadow-lg">
            View Profile
          </button>
        </div>
      </swiper-slide>
    </swiper-container>
  </div>
</section>
