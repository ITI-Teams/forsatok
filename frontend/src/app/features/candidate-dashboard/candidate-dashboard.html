<div class="flex h-screen bg-gray-100 dark:bg-gray-900 mt-20">

  <!-- Sidebar -->
  <aside class="w-64 bg-white dark:bg-gray-800 shadow-lg p-6 flex flex-col">
    <h2 class="text-2xl font-semibold mb-6 text-gray-800 dark:text-gray-200">Candidate Dashboard</h2>

    <ul class="space-y-3">
      <!-- <li (click)="setTab('description')" 
          [ngClass]="activeTab==='description' ? 'bg-indigo-600 text-white' : 'text-gray-700 hover:bg-gray-200 dark:text-gray-300 dark:hover:bg-gray-700'" 
          class="cursor-pointer px-4 py-2 rounded-lg transition">Description</li> -->

      <li (click)="setTab('messages')" 
          [ngClass]="activeTab==='messages' ? 'bg-indigo-600 text-white' : 'text-gray-700 hover:bg-gray-200 dark:text-gray-300 dark:hover:bg-gray-700'" 
          class="cursor-pointer px-4 py-2 rounded-lg transition">Messages</li>

      <!-- <li (click)="setTab('applications')" 
          [ngClass]="activeTab==='applications' ? 'bg-indigo-600 text-white' : 'text-gray-700 hover:bg-gray-200 dark:text-gray-300 dark:hover:bg-gray-700'" 
          class="cursor-pointer px-4 py-2 rounded-lg transition">Applications</li> -->

      <li (click)="setTab('notifications')" 
          [ngClass]="activeTab==='notifications' ? 'bg-indigo-600 text-white' : 'text-gray-700 hover:bg-gray-200 dark:text-gray-300 dark:hover:bg-gray-700'" 
          class="cursor-pointer px-4 py-2 rounded-lg transition">Notifications</li>

      <li (click)="setTab('saved')" 
          [ngClass]="activeTab==='saved' ? 'bg-indigo-600 text-white' : 'text-gray-700 hover:bg-gray-200 dark:text-gray-300 dark:hover:bg-gray-700'" 
          class="cursor-pointer px-4 py-2 rounded-lg transition">Saved Jobs</li>

      <!-- <li (click)="setTab('reviews')" 
          [ngClass]="activeTab==='reviews' ? 'bg-indigo-600 text-white' : 'text-gray-700 hover:bg-gray-200 dark:text-gray-300 dark:hover:bg-gray-700'" 
          class="cursor-pointer px-4 py-2 rounded-lg transition">Reviews</li> -->
    </ul>
  </aside>

  <!-- Content Area -->
  <main class="flex-1 p-10 overflow-y-auto text-gray-800 dark:text-gray-200">

    <!-- Messages -->
    <section *ngIf="activeTab==='messages'" class="space-y-4">
      <h1 class="text-3xl font-semibold">Messages</h1>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div *ngFor="let msg of candidateData.messages" class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow">
          <p class="font-semibold text-indigo-600">{{ msg.from }}</p>
          <p class="text-gray-600 dark:text-gray-300">{{ msg.text }}</p>
        </div>
      </div>
    </section>

    <!-- Notifications -->
    <section *ngIf="activeTab==='notifications'" class="space-y-4">
      <h1 class="text-3xl font-semibold">Notifications</h1>
      <div class="space-y-3">
        <div *ngFor="let note of candidateData.notifications" class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow">
          <span>{{ note.text }}</span>
        </div>
      </div>
    </section>

    <!-- Saved Jobs -->
    <section *ngIf="activeTab==='saved'" class="space-y-4">
      <h1 class="text-3xl font-semibold">Saved Jobs</h1>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div *ngFor="let job of candidateData.saved" class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow">
          <p class="font-semibold">{{ job.jobTitle }}</p>
        </div>
      </div>
    </section>

  </main>
</div>
