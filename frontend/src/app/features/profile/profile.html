<div class="min-h-screen p-6 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <div class="max-w-3xl mx-auto bg-white dark:bg-gray-800 shadow-md rounded-xl p-6">
    <h2 class="text-2xl font-bold mb-6">My Profile</h2>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <!-- Name -->
      <div>
        <label class="block font-medium mb-1">Full Name</label>
        <input type="text" formControlName="name" class="w-full border border-gray-300 dark:border-gray-700 rounded px-3 py-2 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <!-- Email -->
      <div>
        <label class="block font-medium mb-1">Email</label>
        <input type="email" formControlName="email" class="w-full border border-gray-300 dark:border-gray-700 rounded px-3 py-2 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <!-- Password -->
      <div>
        <label class="block font-medium mb-1">Password</label>
        <input type="password" formControlName="password" placeholder="Leave empty to keep current password" class="w-full border border-gray-300 dark:border-gray-700 rounded px-3 py-2 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <!-- Phone -->
      <div>
        <label class="block font-medium mb-1">Phone</label>
        <input type="text" formControlName="phone" class="w-full border border-gray-300 dark:border-gray-700 rounded px-3 py-2 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <!-- Education -->
      <div>
        <label class="block font-medium mb-1">Education</label>
        <input type="text" formControlName="education" class="w-full border border-gray-300 dark:border-gray-700 rounded px-3 py-2 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <!-- Experience -->
      <div>
        <label class="block font-medium mb-1">Experience</label>
        <textarea formControlName="experience" rows="3" class="w-full border border-gray-300 dark:border-gray-700 rounded px-3 py-2 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
      </div>

      <!-- Bio -->
      <div>
        <label class="block font-medium mb-1">Bio</label>
        <textarea formControlName="bio" rows="3" class="w-full border border-gray-300 dark:border-gray-700 rounded px-3 py-2 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
      </div>

      <!-- Gender -->
      <div>
        <label class="block font-medium mb-1">Gender</label>
        <select formControlName="gender" class="w-full border border-gray-300 dark:border-gray-700 rounded px-3 py-2 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- Date of Birth -->
      <div>
        <label class="block font-medium mb-1">Date of Birth</label>
        <input type="date" formControlName="dateOfBirth" class="w-full border border-gray-300 dark:border-gray-700 rounded px-3 py-2 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <!-- Resume -->
      <div>
        <label class="block font-medium mb-1">Resume (PDF/DOC)</label>
        <input type="file" (change)="onResumeChange($event)" class="w-full text-gray-900 dark:text-gray-100">
        <a *ngIf="candidate.resume" [href]="candidate.resume" target="_blank" class="underline">
          {{ candidate.resume?.split('/').pop() }}
        </a>
      </div>

      <!-- Skills (searchable multi-select) -->
      <div>
        <label class="block font-medium mb-1">Skills</label>
        <ng-select
        [items]="allSkills"
        bindLabel="name"
        bindValue="id"
        formControlName="skills"
        [multiple]="true"
        placeholder="Select skills"
        class="w-full dark:bg-gray-700 dark:text-gray-100"
      >
      </ng-select>
      </div>

      <!-- Submit Button -->
      <div class="pt-4">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
          Save Changes
        </button>
      </div>

    </form>
  </div>
</div>
